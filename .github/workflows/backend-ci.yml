name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: college_attendance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Setup Database and Run Migrations
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: college_attendance_test
        run: |
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/001_create_roles.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/002_create_users.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/003_create_students.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/004_create_teachers.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/005_create_academic_years.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/006_create_departments.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/007_create_specializations.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/008_create_admission_batches.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/009_create_semesters.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/010_create_classes.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/011_create_student_enrollments.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/012_create_subjects.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/013_create_class_subjects.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/014_create_department_hod_assignments.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/015_create_tutor_assignments.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/016_create_regular_timetable_entries.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/017_create_daily_timetable_changes.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/018_create_class_sessions.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/019_create_attendance_records.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/020_create_attendance_audit_logs.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/021_create_academic_holidays.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/022_create_audit_logs.sql
          mysql -h 127.0.0.1 -u root -proot college_attendance_test < ../database/migrations/023_create_system_settings.sql

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: college_attendance_test
        run: npx jest tests/integration --runInBand

      - name: Production Build
        run: npm run build
